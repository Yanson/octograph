[influxdb]
url = http://influxdb:8086
org = monitoring
bucket = energy-metrics
included_tags = account_number,property_address_line_1,property_address_line_2,property_address_line_3,property_town,property_postcode,electricity_mpan,gas_mprn,meter_serial_number,agreement_tariff_code
additional_tags = location=Home

[octopus]
account_number = A-XXXXXXXX

; Optional: add or override tags for a meter point (MPAN / MPRN) or meter (serial number).
; Meters inherit their meter point's tags; a meter's own section wins. E.g. after moving house:
;[additional_tags:1900000000002]
;location = New Home